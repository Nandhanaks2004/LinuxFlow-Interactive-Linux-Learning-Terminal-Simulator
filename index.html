<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinuxFlow — Interactive Linux Learning Platform</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bg4:#30363d;
  --border:#30363d;--border2:#484f58;
  --text:#e6edf3;--text2:#8b949e;--text3:#6e7681;
  --green:#39d353;--green2:#238636;--green3:#2ea043;
  --blue:#58a6ff;--blue2:#1f6feb;
  --amber:#f0883e;--amber2:#d29922;
  --red:#f85149;--purple:#bc8cff;
  --cyan:#79c0ff;--teal:#56d364;
  --radius:6px;--radius2:10px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text)}

/* ── LAYOUT ── */
.app{display:grid;grid-template-columns:280px 1fr;grid-template-rows:56px 1fr;height:100vh;overflow:hidden}

/* ── TOPBAR ── */
.topbar{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:100;flex-shrink:0}
.logo{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--green);letter-spacing:-1px;white-space:nowrap}
.logo span{color:var(--text2)}
.tagline{font-size:12px;color:var(--text3);white-space:nowrap}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.xp-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.xp-track{width:120px;height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;background:linear-gradient(90deg,var(--green2),var(--green));border-radius:3px;transition:width .5s ease}
.level-badge{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:600;color:var(--amber);white-space:nowrap}

/* ── SIDEBAR ── */
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:12px 0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sidebar-section{padding:8px 16px 4px;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.mod-item{display:flex;align-items:center;gap:10px;padding:8px 16px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;user-select:none}
.mod-item:hover{background:var(--bg3)}
.mod-item.active{background:rgba(56,211,83,.07);border-left-color:var(--green)}
.mod-item.active .mod-name{color:var(--green)}
.mod-item.done .mod-check{color:var(--green)}
.mod-num{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);width:22px;flex-shrink:0}
.mod-name{font-size:12px;font-weight:500;color:var(--text2);line-height:1.3;flex:1}
.mod-check{font-size:12px;color:transparent;flex-shrink:0}

/* ── MAIN ── */
.main{overflow-y:auto;background:var(--bg)}
.main::-webkit-scrollbar{width:6px}
.main::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── PANELS ── */
.panel{padding:36px 40px;max-width:860px;display:none;flex-direction:column;gap:22px}
.panel.active{display:flex}
.panel-header{border-bottom:1px solid var(--border);padding-bottom:18px}
.mod-badge{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;color:var(--text3);margin-bottom:10px}
.panel-title{font-size:28px;font-weight:700;color:var(--text);line-height:1.2}
.panel-subtitle{font-size:14px;color:var(--text2);margin-top:6px;line-height:1.5}

/* ── CONTENT BLOCKS ── */
.analogy-box{background:rgba(56,211,83,.06);border:1px solid rgba(56,211,83,.18);border-radius:var(--radius);padding:16px 18px;font-size:13px;color:var(--text);line-height:1.7}
.analogy-box strong{color:var(--green);font-weight:600}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:20px}
.card-title{font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card p{font-size:13px;color:var(--text2);line-height:1.7}

.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.concept-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.concept-card h4{font-size:12px;font-weight:600;color:var(--amber);margin-bottom:6px}
.concept-card p{font-size:12px;color:var(--text2);line-height:1.55}

/* ── COMMAND BLOCKS ── */
.cmd-block{background:#010409;border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;margin:6px 0}
.cmd-header{background:var(--bg3);padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.cmd-dots{display:flex;gap:5px}
.dot{width:10px;height:10px;border-radius:50%}
.dot-r{background:#ff5f56}.dot-y{background:#ffbd2e}.dot-g{background:#27c93f}
.cmd-label{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace}
.cmd-body{padding:14px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8}
.prompt{color:var(--green)}
.out{color:var(--text2)}
.out-info{color:var(--cyan)}
.out-warn{color:var(--amber)}
.out-err{color:var(--red)}
.out-perm{color:var(--purple)}
.out-ok{color:var(--green)}

/* ── FILE TREE ── */
.file-tree{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:2.1}
.ft-dir{color:var(--blue)}
.ft-indent{padding-left:22px;display:block}

/* ── PERM DISPLAY ── */
.perm-demo{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:15px;margin:10px 0;flex-wrap:wrap}
.perm-seg{padding:5px 10px;border-radius:4px;font-weight:700}
.ps-type{background:rgba(188,140,255,.15);color:var(--purple)}
.ps-u{background:rgba(56,211,83,.15);color:var(--green)}
.ps-g{background:rgba(88,166,255,.15);color:var(--blue)}
.ps-o{background:rgba(240,136,62,.15);color:var(--amber)}
.perm-labels{display:flex;gap:8px;font-size:11px;color:var(--text3);font-family:'Space Grotesk',sans-serif;margin-bottom:6px}
.perm-labels span{min-width:42px}

/* ── NUMERIC PERMS ── */
.num-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.num-cell{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.num-val{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--amber);margin-bottom:4px}
.num-lbl{font-size:11px;color:var(--text3)}

/* ── DISTROS ── */
.distro-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.distro-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius2);padding:18px;text-align:center}
.distro-icon{font-size:34px;margin-bottom:10px}
.distro-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px}
.distro-use{font-size:11px;color:var(--text3);margin-bottom:10px}
.d-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:700}
.d-g{background:rgba(56,211,83,.15);color:var(--green)}
.d-r{background:rgba(248,81,73,.15);color:var(--red)}
.d-b{background:rgba(88,166,255,.15);color:var(--blue)}
.distro-desc{font-size:11px;color:var(--text3);margin-top:10px;line-height:1.6;text-align:left}

/* ── SECURITY BOX ── */
.sec-box{background:rgba(248,81,73,.05);border:1px solid rgba(248,81,73,.22);border-radius:var(--radius);padding:16px 18px}
.sec-box h4{color:var(--red);font-size:13px;font-weight:700;margin-bottom:6px}
.sec-box p{font-size:13px;color:var(--text2);line-height:1.7}
.sec-box code{font-family:'JetBrains Mono',monospace;color:var(--amber);font-size:12px}

/* ── TERMINAL SIMULATOR ── */
.terminal-wrap{background:#010409;border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.term-header{background:var(--bg3);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.term-title{font-size:12px;color:var(--text3);font-family:'JetBrains Mono',monospace;flex:1}
.term-badge{font-size:10px;background:rgba(56,211,83,.15);color:var(--green);border-radius:4px;padding:2px 8px;font-family:'Space Grotesk',sans-serif;font-weight:600}
.term-body{padding:16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;min-height:240px;max-height:340px;overflow-y:auto;cursor:text}
.term-body::-webkit-scrollbar{width:4px}
.term-body::-webkit-scrollbar-thumb{background:var(--border2)}
.t-out{color:var(--text2);margin:1px 0;white-space:pre-wrap;word-break:break-all}
.t-out.ok{color:var(--green)}
.t-out.err{color:var(--red)}
.t-out.info{color:var(--cyan)}
.t-out.warn{color:var(--amber)}
.t-out.perm{color:var(--purple)}
.t-prompt-str{color:var(--green)}
.t-input-line{display:flex;align-items:center;gap:4px;margin-top:4px}
.t-input{background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;flex:1;caret-color:var(--green)}

.hint-bar{background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.18);border-radius:var(--radius);padding:10px 14px;margin-top:8px}
.hint-bar-title{font-size:11px;font-weight:700;color:var(--blue);margin-bottom:8px}
.hint-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text2);cursor:pointer;transition:all .15s;user-select:none}
.chip:hover{border-color:var(--blue);color:var(--blue);background:rgba(88,166,255,.08)}

/* ── QUIZ ── */
.quiz-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:22px}
.quiz-q{font-size:14px;font-weight:500;color:var(--text);margin-bottom:14px;line-height:1.6}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.quiz-opt{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text2);cursor:pointer;transition:all .15s;text-align:left;font-family:'Space Grotesk',sans-serif;width:100%}
.quiz-opt:hover:not(:disabled){border-color:var(--border2);color:var(--text)}
.quiz-opt.correct{background:rgba(56,211,83,.09);border-color:var(--green);color:var(--green)}
.quiz-opt.wrong{background:rgba(248,81,73,.09);border-color:var(--red);color:var(--red)}
.quiz-feedback{padding:12px 14px;border-radius:var(--radius);font-size:13px;line-height:1.6;margin-top:10px}
.quiz-feedback.good{background:rgba(56,211,83,.07);border:1px solid rgba(56,211,83,.2);color:var(--green)}
.quiz-feedback.bad{background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2);color:var(--red)}

/* ── CHALLENGE BOX ── */
.challenge-box{background:var(--bg2);border:1px solid rgba(240,136,62,.28);border-radius:var(--radius2);padding:20px}
.challenge-title{color:var(--amber);font-size:13px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.challenge-desc{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:14px}
.task-list{list-style:none;display:flex;flex-direction:column;gap:7px}
.task-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);padding:8px 12px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);transition:all .2s}
.task-item.done{color:var(--green);border-color:rgba(56,211,83,.2);background:rgba(56,211,83,.05)}
.task-check{width:18px;height:18px;border-radius:50%;border:1px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--text3)}
.task-item.done .task-check{background:var(--green2);border-color:var(--green);color:#fff;font-size:10px}

/* ── NEXT BTN ── */
.next-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 22px;background:var(--green2);border:none;border-radius:var(--radius);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:background .15s;margin-top:4px}
.next-btn:hover{background:var(--green3)}

/* ── XP POPUP ── */
.xp-popup{position:fixed;top:66px;right:20px;background:var(--bg2);border:1px solid var(--green);border-radius:var(--radius2);padding:10px 18px;font-size:13px;color:var(--green);font-weight:700;z-index:9999;opacity:0;transform:translateY(-8px);transition:all .3s;pointer-events:none;font-family:'Space Grotesk',sans-serif}
.xp-popup.show{opacity:1;transform:translateY(0)}

/* ── FINISH CARD ── */
.finish-card{background:var(--bg2);border:1px solid var(--green);border-radius:var(--radius2);padding:28px;text-align:center}
.finish-card .trophy{font-size:44px;margin-bottom:12px}
.finish-card h2{font-size:22px;font-weight:700;color:var(--green);margin-bottom:8px}
.finish-card p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:18px}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr}
  .sidebar{display:none}
  .panel{padding:20px 18px}
  .distro-grid{grid-template-columns:1fr}
  .num-grid{grid-template-columns:repeat(2,1fr)}
  .tagline{display:none}
}
</style>
</head>
<body>

<div class="app">

  <!-- ══ TOPBAR ══ -->
  <div class="topbar">
    <div class="logo">Linux<span>Flow</span></div>
    <div class="tagline">Learn Linux by doing. Understand every command.</div>
    <div class="topbar-right">
      <div class="xp-bar">
        <span id="xp-label">0 XP</span>
        <div class="xp-track"><div class="xp-fill" id="xp-fill" style="width:0%"></div></div>
        <span class="level-badge" id="level-badge">Level 1</span>
      </div>
    </div>
  </div>

  <!-- ══ SIDEBAR ══ -->
  <div class="sidebar" id="sidebar"></div>

  <!-- ══ MAIN ══ -->
  <div class="main" id="main"></div>

</div>

<div class="xp-popup" id="xp-popup"></div>

<script>
/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
const state = {
  currentMod: 0,
  xp: 0,
  level: 1,
  completed: new Set(),
};

/* ════════════════════════════════════════
   VIRTUAL FILE SYSTEM
════════════════════════════════════════ */
let vfs = {
  "/":                        {type:"dir",children:["home","etc","var","bin","tmp","usr"]},
  "/home":                    {type:"dir",children:["student"]},
  "/home/student":            {type:"dir",children:["documents","downloads","secret.txt","notes.txt","script.sh"]},
  "/home/student/documents":  {type:"dir",children:["report.pdf","todo.txt"]},
  "/home/student/downloads":  {type:"dir",children:[]},
  "/home/student/secret.txt": {type:"file",content:"This is a secret file!\nDo not share this.",perms:"600",owner:"student",group:"student"},
  "/home/student/notes.txt":  {type:"file",content:"Linux is awesome!\nKeep learning every day.",perms:"644",owner:"student",group:"student"},
  "/home/student/script.sh":  {type:"file",content:"#!/bin/bash\necho 'Hello from script!'",perms:"755",owner:"student",group:"student"},
  "/home/student/documents/report.pdf": {type:"file",content:"[Binary PDF content]",perms:"644",owner:"student",group:"student"},
  "/home/student/documents/todo.txt":   {type:"file",content:"1. Learn Linux\n2. Master permissions\n3. Try cybersecurity",perms:"644",owner:"student",group:"student"},
  "/etc":              {type:"dir",children:["passwd","hosts","sudoers","hostname"]},
  "/etc/passwd":       {type:"file",content:"root:x:0:0:root:/root:/bin/bash\nstudent:x:1000:1000:Student,,,:/home/student:/bin/bash",perms:"644",owner:"root",group:"root"},
  "/etc/hosts":        {type:"file",content:"127.0.0.1   localhost\n127.0.1.1   linuxbox",perms:"644",owner:"root",group:"root"},
  "/etc/sudoers":      {type:"file",content:"# This file controls sudo access\nroot    ALL=(ALL:ALL) ALL\nstudent ALL=(ALL) ALL",perms:"440",owner:"root",group:"root"},
  "/etc/hostname":     {type:"file",content:"linuxbox",perms:"644",owner:"root",group:"root"},
  "/var":              {type:"dir",children:["log","tmp"]},
  "/var/log":          {type:"dir",children:["syslog","auth.log"]},
  "/var/log/syslog":   {type:"file",content:"Apr 23 09:00:01 linuxbox kernel: Boot complete\nApr 23 09:00:03 linuxbox systemd: Started service",perms:"640",owner:"root",group:"adm"},
  "/var/log/auth.log": {type:"file",content:"Apr 23 09:05:12 linuxbox sudo: student : TTY=pts/0\nApr 23 09:10:04 linuxbox sshd: Failed password for root",perms:"640",owner:"root",group:"adm"},
  "/bin":              {type:"dir",children:["bash","ls","cat","cp","mv","rm","mkdir","chmod","chown"]},
  "/tmp":              {type:"dir",children:[]},
  "/usr":              {type:"dir",children:["bin","local"]},
  "/usr/bin":          {type:"dir",children:["grep","find","nano","python3"]},
  "/usr/local":        {type:"dir",children:[]},
};

let termCwd   = "/home/student";
let termUser  = "student";
let cmdHistory = [];
let cmdHistIdx = -1;

/* ════════════════════════════════════════
   PATH RESOLVER
════════════════════════════════════════ */
function resolvePath(p, cwd) {
  if (!p || p === "~") return "/home/student";
  if (p === ".")  return cwd;
  if (p === "..") {
    const parts = cwd.split("/").filter(Boolean);
    if (!parts.length) return "/";
    parts.pop();
    return "/" + parts.join("/") || "/";
  }
  const base = p.startsWith("/") ? "" : (cwd === "/" ? "" : cwd);
  const full = base + "/" + p;
  const parts = full.split("/").filter(Boolean);
  const out = [];
  for (const seg of parts) {
    if (seg === "..") out.pop();
    else if (seg !== ".") out.push(seg);
  }
  return "/" + out.join("/") || "/";
}

function permBits(p, isDir) {
  const d = isDir ? "d" : "-";
  const b = n => {
    const v = parseInt(n);
    return (v >= 4 ? "r" : "-") + (v === 6 || v === 7 || v === 2 || v === 3 ? "w" : "-") + (v % 2 === 1 ? "x" : "-");
  };
  const s = String(p).padStart(3, "0");
  return d + b(s[0]) + b(s[1]) + b(s[2]);
}

/* ════════════════════════════════════════
   COMMAND EXECUTOR
════════════════════════════════════════ */
function executeCmd(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return [];
  cmdHistory.unshift(trimmed);
  if (cmdHistory.length > 100) cmdHistory.pop();
  cmdHistIdx = -1;

  const parts = trimmed.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
  let sudo = false, cmd, args;

  if (parts[0] === "sudo") { sudo = true; cmd = parts[1]; args = parts.slice(2); }
  else { cmd = parts[0]; args = parts.slice(1); }

  const cleanArg = s => s ? s.replace(/^["']|["']$/g, "") : s;
  args = args.map(cleanArg);

  const o = [];

  switch (cmd) {
    case "whoami":
      o.push({t: sudo ? "root" : termUser, c:"ok"});
      break;
    case "pwd":
      o.push({t: termCwd, c:"info"});
      break;
    case "hostname":
      o.push({t:"linuxbox"});
      break;
    case "date":
      o.push({t: new Date().toUTCString()});
      break;
    case "uname":
      if (args.includes("-a")) o.push({t:"Linux linuxbox 5.15.0-91-generic #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023 x86_64 x86_64 x86_64 GNU/Linux"});
      else o.push({t:"Linux"});
      break;
    case "echo": {
      const redir = args.indexOf(">"), apnd = args.indexOf(">>");
      if (redir > 0) {
        const content = args.slice(0, redir).join(" ");
        const target = resolvePath(args[redir + 1], termCwd);
        vfs[target] = {type:"file", content, perms:"644", owner:termUser, group:termUser};
        const par = target.substring(0, target.lastIndexOf("/")) || "/";
        const nm  = target.split("/").pop();
        if (vfs[par] && !vfs[par].children.includes(nm)) vfs[par].children.push(nm);
        o.push({t:`Written to ${args[redir+1]}`, c:"ok"});
      } else if (apnd > 0) {
        const content = args.slice(0, apnd).join(" ");
        const target  = resolvePath(args[apnd + 1], termCwd);
        if (vfs[target]) vfs[target].content += "\n" + content;
        else { vfs[target] = {type:"file", content, perms:"644", owner:termUser, group:termUser}; }
        o.push({t:`Appended to ${args[apnd+1]}`, c:"ok"});
      } else {
        o.push({t: args.join(" ")});
      }
      break;
    }
    case "clear":
      return "__clear__";
    case "ls": {
      const flags   = args.filter(a => a.startsWith("-")).join("");
      const pathArg = args.find(a => !a.startsWith("-"));
      const target  = pathArg ? resolvePath(pathArg, termCwd) : termCwd;
      const node    = vfs[target];
      if (!node) { o.push({t:`ls: cannot access '${pathArg}': No such file or directory`, c:"err"}); break; }
      if (node.type !== "dir") { o.push({t:target.split("/").pop()}); break; }
      if (flags.includes("l") || flags.includes("a")) {
        o.push({t:`total ${node.children.length}`});
        if (flags.includes("a")) {
          o.push({t:`drwxr-xr-x 2 ${termUser} ${termUser} 4096 Apr 23 09:00 .`, c:"perm"});
          o.push({t:`drwxr-xr-x 5 root root  4096 Apr 23 09:00 ..`, c:"perm"});
        }
        for (const c of node.children) {
          const child = vfs[(target === "/" ? "" : target) + "/" + c];
          if (!child) continue;
          const isDir = child.type === "dir";
          const bits  = permBits(child.perms || (isDir ? "755" : "644"), isDir);
          const nm    = isDir ? c + "/" : c;
          o.push({t:`${bits} 1 ${child.owner||termUser} ${child.group||termUser} ${isDir ? 4096 : (child.content||"").length} Apr 23 09:00 ${nm}`, c: isDir?"info": c.endsWith(".sh")?"ok":""});
        }
      } else {
        const line = node.children.map(c => {
          const child = vfs[(target === "/" ? "" : target) + "/" + c];
          return (child && child.type === "dir") ? c + "/" : c;
        }).join("  ");
        if (!line) o.push({t:"(empty directory)", c:"perm"});
        else o.push({t: line});
      }
      break;
    }
    case "cd": {
      const target = args[0] ? resolvePath(args[0], termCwd) : "/home/student";
      if (!vfs[target])               { o.push({t:`bash: cd: ${args[0]}: No such file or directory`, c:"err"}); break; }
      if (vfs[target].type !== "dir") { o.push({t:`bash: cd: ${args[0]}: Not a directory`, c:"err"}); break; }
      if (target.startsWith("/root") && !sudo) { o.push({t:`bash: cd: ${target}: Permission denied`, c:"err"}); break; }
      termCwd = target;
      break;
    }
    case "cat": {
      if (!args[0]) { o.push({t:"cat: missing operand", c:"err"}); break; }
      const target = resolvePath(args[0], termCwd);
      const node   = vfs[target];
      if (!node)              { o.push({t:`cat: ${args[0]}: No such file or directory`, c:"err"}); break; }
      if (node.type === "dir"){ o.push({t:`cat: ${args[0]}: Is a directory`, c:"err"}); break; }
      if (node.owner === "root" && parseInt((node.perms||"644")[2]) === 0 && !sudo)
        { o.push({t:`cat: ${args[0]}: Permission denied`, c:"err"}); break; }
      (node.content || "").split("\n").forEach(l => o.push({t:l}));
      break;
    }
    case "touch": {
      if (!args[0]) { o.push({t:"touch: missing file operand", c:"err"}); break; }
      const target = resolvePath(args[0], termCwd);
      if (!vfs[target]) {
        vfs[target] = {type:"file", content:"", perms:"644", owner:termUser, group:termUser};
        const par = target.substring(0, target.lastIndexOf("/")) || "/";
        const nm  = target.split("/").pop();
        if (vfs[par] && !vfs[par].children.includes(nm)) vfs[par].children.push(nm);
      }
      o.push({t:`File created: ${args[0]}`, c:"ok"});
      break;
    }
    case "mkdir": {
      if (!args[0]) { o.push({t:"mkdir: missing operand", c:"err"}); break; }
      const target = resolvePath(args[0], termCwd);
      if (vfs[target]) { o.push({t:`mkdir: cannot create directory '${args[0]}': File exists`, c:"err"}); break; }
      vfs[target] = {type:"dir", children:[]};
      const par = target.substring(0, target.lastIndexOf("/")) || "/";
      const nm  = target.split("/").pop();
      if (vfs[par] && !vfs[par].children.includes(nm)) vfs[par].children.push(nm);
      o.push({t:`Directory created: ${args[0]}`, c:"ok"});
      break;
    }
    case "rm": {
      const farg = args.find(a => !a.startsWith("-")) || "";
      if (!farg) { o.push({t:"rm: missing operand", c:"err"}); break; }
      const target = resolvePath(farg, termCwd);
      const node   = vfs[target];
      if (!node) { o.push({t:`rm: cannot remove '${farg}': No such file or directory`, c:"err"}); break; }
      if (node.type === "dir" && !args.includes("-r") && !args.includes("-rf")) { o.push({t:`rm: cannot remove '${farg}': Is a directory (hint: rm -r)`, c:"err"}); break; }
      if (node.owner === "root" && !sudo) { o.push({t:`rm: cannot remove '${farg}': Permission denied`, c:"err"}); break; }
      delete vfs[target];
      const par = target.substring(0, target.lastIndexOf("/")) || "/";
      const nm  = target.split("/").pop();
      if (vfs[par]) vfs[par].children = vfs[par].children.filter(c => c !== nm);
      o.push({t:`Removed: ${farg}`, c:"ok"});
      break;
    }
    case "cp": {
      if (args.length < 2) { o.push({t:"cp: missing destination file operand", c:"err"}); break; }
      const src = resolvePath(args[0], termCwd);
      const dst = resolvePath(args[1], termCwd);
      if (!vfs[src]) { o.push({t:`cp: ${args[0]}: No such file or directory`, c:"err"}); break; }
      vfs[dst] = JSON.parse(JSON.stringify(vfs[src]));
      const par = dst.substring(0, dst.lastIndexOf("/")) || "/";
      const nm  = dst.split("/").pop();
      if (vfs[par] && !vfs[par].children.includes(nm)) vfs[par].children.push(nm);
      o.push({t:`Copied: ${args[0]} → ${args[1]}`, c:"ok"});
      break;
    }
    case "mv": {
      if (args.length < 2) { o.push({t:"mv: missing destination file operand", c:"err"}); break; }
      const src = resolvePath(args[0], termCwd);
      const dst = resolvePath(args[1], termCwd);
      if (!vfs[src]) { o.push({t:`mv: ${args[0]}: No such file or directory`, c:"err"}); break; }
      vfs[dst] = vfs[src];
      delete vfs[src];
      const sp  = src.substring(0, src.lastIndexOf("/")) || "/";
      const sn  = src.split("/").pop();
      if (vfs[sp]) vfs[sp].children = vfs[sp].children.filter(c => c !== sn);
      const dp  = dst.substring(0, dst.lastIndexOf("/")) || "/";
      const dn  = dst.split("/").pop();
      if (vfs[dp] && !vfs[dp].children.includes(dn)) vfs[dp].children.push(dn);
      o.push({t:`Moved: ${args[0]} → ${args[1]}`, c:"ok"});
      break;
    }
    case "chmod": {
      if (args.length < 2) { o.push({t:"chmod: missing operand", c:"err"}); break; }
      const target = resolvePath(args[1], termCwd);
      const node   = vfs[target];
      if (!node) { o.push({t:`chmod: cannot access '${args[1]}': No such file or directory`, c:"err"}); break; }
      if (node.owner !== termUser && !sudo) { o.push({t:`chmod: changing permissions of '${args[1]}': Operation not permitted`, c:"err"}); break; }
      if (/^\d+$/.test(args[0])) {
        node.perms = args[0];
        o.push({t:`Permissions of '${args[1]}' changed to ${args[0]} (${permBits(args[0], node.type==="dir")})`, c:"ok"});
      } else {
        o.push({t:`Symbolic chmod applied: ${args[0]} on ${args[1]}`, c:"ok"});
      }
      break;
    }
    case "chown": {
      if (!sudo) { o.push({t:"chown: changing ownership: Operation not permitted", c:"err"}); o.push({t:"Tip: prefix with 'sudo'"}); break; }
      if (args.length < 2) { o.push({t:"chown: missing operand", c:"err"}); break; }
      const target = resolvePath(args[1], termCwd);
      if (!vfs[target]) { o.push({t:`chown: cannot access '${args[1]}': No such file or directory`, c:"err"}); break; }
      const [nOwner, nGroup] = args[0].split(":");
      vfs[target].owner = nOwner;
      if (nGroup) vfs[target].group = nGroup;
      o.push({t:`Ownership of '${args[1]}' changed to ${args[0]}`, c:"ok"});
      break;
    }
    case "chgrp": {
      if (!sudo) { o.push({t:"chgrp: changing group: Operation not permitted", c:"err"}); break; }
      if (args.length < 2) { o.push({t:"chgrp: missing operand", c:"err"}); break; }
      const target = resolvePath(args[1], termCwd);
      if (!vfs[target]) { o.push({t:`chgrp: cannot access '${args[1]}': No such file or directory`, c:"err"}); break; }
      vfs[target].group = args[0];
      o.push({t:`Group of '${args[1]}' changed to ${args[0]}`, c:"ok"});
      break;
    }
    case "find": {
      const pathArg  = args.find(a => !a.startsWith("-")) || termCwd;
      const nameIdx  = args.findIndex(a => a === "-name");
      const nameVal  = nameIdx >= 0 ? (args[nameIdx + 1] || "").replace(/\*|\./g,"").toLowerCase() : null;
      const target   = resolvePath(pathArg, termCwd);
      const results  = [];
      function findR(p) {
        const n = vfs[p]; if (!n) return;
        const nm = p.split("/").pop().toLowerCase();
        if (!nameVal || nm.includes(nameVal)) results.push(p);
        if (n.type === "dir") n.children.forEach(c => findR((p === "/" ? "" : p) + "/" + c));
      }
      findR(target);
      if (!results.length) o.push({t:"(no results found)", c:"perm"});
      else results.forEach(r => o.push({t:r, c:"info"}));
      break;
    }
    case "grep": {
      if (args.length < 2) { o.push({t:"Usage: grep PATTERN FILE", c:"err"}); break; }
      const pat    = args[0].toLowerCase();
      const target = resolvePath(args[1], termCwd);
      const node   = vfs[target];
      if (!node || node.type === "dir") { o.push({t:`grep: ${args[1]}: No such file`, c:"err"}); break; }
      const lines = (node.content||"").split("\n").filter(l => l.toLowerCase().includes(pat));
      if (!lines.length) o.push({t:"(no matches found)", c:"perm"});
      else lines.forEach(l => o.push({t:l, c:"warn"}));
      break;
    }
    case "history":
      if (!cmdHistory.length) o.push({t:"(no history yet)"});
      else cmdHistory.slice(0,20).forEach((h,i) => o.push({t:`${String(cmdHistory.length-i).padStart(4," ")}  ${h}`}));
      break;
    case "id":
      o.push({t:`uid=1000(${termUser}) gid=1000(${termUser}) groups=1000(${termUser}),4(adm),27(sudo)`, c:"info"});
      break;
    case "groups":
      o.push({t:`${termUser} adm sudo`, c:"info"});
      break;
    case "adduser": case "useradd":
      if (!sudo) { o.push({t:`${cmd}: only root can add users — use sudo`, c:"err"}); break; }
      if (!args[0]) { o.push({t:`Usage: sudo adduser USERNAME`, c:"err"}); break; }
      o.push({t:`Adding user '${args[0]}' ...`});
      o.push({t:`Adding new group '${args[0]}' (1001) ...`});
      o.push({t:`Creating home directory '/home/${args[0]}' ...`});
      o.push({t:`User '${args[0]}' created successfully!`, c:"ok"});
      break;
    case "passwd":
      if (!sudo && args[0]) { o.push({t:"passwd: Permission denied", c:"err"}); break; }
      o.push({t:"New password: (hidden)"});
      o.push({t:"Retype new password: (hidden)"});
      o.push({t:"passwd: password updated successfully", c:"ok"});
      break;
    case "groupadd":
      if (!sudo) { o.push({t:"groupadd: Permission denied", c:"err"}); break; }
      if (!args[0]) { o.push({t:"Usage: sudo groupadd GROUPNAME", c:"err"}); break; }
      o.push({t:`Group '${args[0]}' created.`, c:"ok"});
      break;
    case "usermod":
      if (!sudo) { o.push({t:"usermod: Permission denied", c:"err"}); break; }
      o.push({t:`User modified successfully.`, c:"ok"});
      break;
    case "nano": case "vim": case "vi": case "emacs":
      o.push({t:`[${cmd} would open here in real Linux]`, c:"warn"});
      o.push({t:`In this simulator use: echo "content" > filename`});
      break;
    case "man":
      if (!args[0]) { o.push({t:"What manual page do you want?", c:"err"}); break; }
      o.push({t:`${args[0].toUpperCase()}(1)              Linux Programmer's Manual`, c:"warn"});
      o.push({t:`NAME`});
      o.push({t:`       ${args[0]} — Linux command`});
      o.push({t:`(In real Linux, press q to exit man)`, c:"perm"});
      break;
    case "help": case "--help":
      o.push({t:"━━━ LinuxFlow Simulator — Available Commands ━━━", c:"warn"});
      o.push({t:"Navigation : whoami  pwd  cd  ls  ls -la  ls -a"});
      o.push({t:"Files      : touch  mkdir  rm  rm -r  cat  cp  mv"});
      o.push({t:"Content    : echo  echo 'x' > file  echo 'x' >> file"});
      o.push({t:"Search     : find  grep  history"});
      o.push({t:"Perms      : chmod 755 file  chmod u+x file"});
      o.push({t:"Ownership  : sudo chown user file  sudo chgrp grp file"});
      o.push({t:"Users      : id  groups  sudo adduser  sudo groupadd"});
      o.push({t:"System     : uname -a  date  hostname  man cmd"});
      o.push({t:"Tips       : Use Tab to autocomplete. ↑↓ for history.", c:"info"});
      break;
    default:
      o.push({t:`bash: ${cmd}: command not found`, c:"err"});
      o.push({t:`Type 'help' to list available commands.`});
  }

  return o;
}

/* ════════════════════════════════════════
   XP SYSTEM
════════════════════════════════════════ */
function addXP(amount, reason) {
  state.xp += amount;
  const needed = state.level * 200;
  if (state.xp >= needed) { state.level++; state.xp -= needed; }
  document.getElementById("xp-fill").style.width = Math.min(100, Math.round((state.xp / (state.level * 200)) * 100)) + "%";
  document.getElementById("xp-label").textContent = state.xp + " XP";
  document.getElementById("level-badge").textContent = "Level " + state.level;
  const pop = document.getElementById("xp-popup");
  pop.textContent = "+" + amount + " XP — " + reason;
  pop.classList.add("show");
  clearTimeout(pop._t);
  pop._t = setTimeout(() => pop.classList.remove("show"), 2400);
}

function completeModule(id) {
  if (!state.completed.has(id)) {
    state.completed.add(id);
    addXP(50, MODULES[id].name + " complete!");
    renderSidebar();
  }
}

/* ════════════════════════════════════════
   TERMINAL FACTORY
════════════════════════════════════════ */
let termCount = 0;
function createTerminal(hints) {
  const id = "term" + (++termCount);
  // Return placeholder div; we'll wire it up after DOM insertion
  return { id, hints };
}

function mountTerminal(id, hints) {
  const wrap = document.getElementById(id);
  if (!wrap) return;

  wrap.innerHTML = `
    <div class="terminal-wrap">
      <div class="term-header">
        <div class="cmd-dots"><div class="dot dot-r"></div><div class="dot dot-y"></div><div class="dot dot-g"></div></div>
        <span class="term-title" id="${id}-title">student@linuxbox:~</span>
        <span class="term-badge">Interactive</span>
      </div>
      <div class="term-body" id="${id}-body" onclick="document.getElementById('${id}-input').focus()">
        <div class="t-out info">LinuxFlow simulator ready. Type a command and press Enter.</div>
        <div class="t-out">Type 'help' to list all commands. Use Tab to autocomplete, ↑↓ for history.</div>
        <div id="${id}-lines"></div>
        <div class="t-input-line" id="${id}-iline">
          <span class="t-prompt-str" id="${id}-prompt">student@linuxbox:/home/student$ </span>
          <input class="t-input" id="${id}-input" type="text" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
    ${hints && hints.length ? `
    <div class="hint-bar" style="margin-top:8px">
      <div class="hint-bar-title">Try these commands:</div>
      <div class="hint-chips">
        ${hints.map(h => `<span class="chip" onclick="injectCmd('${id}','${h.replace(/'/g,"\\'")}')">${h}</span>`).join("")}
      </div>
    </div>` : ""}
  `;

  const input  = document.getElementById(id + "-input");
  const linesDiv = document.getElementById(id + "-lines");
  const body   = document.getElementById(id + "-body");
  const promptEl = document.getElementById(id + "-prompt");
  const titleEl  = document.getElementById(id + "-title");

  function getPrompt() {
    const short = termCwd.replace("/home/student", "~");
    return `student@linuxbox:${short}$ `;
  }

  input.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const val = input.value;
      if (!val.trim()) return;

      // echo command line
      const cline = document.createElement("div");
      cline.style.cssText = "display:flex;gap:4px;margin-bottom:2px";
      cline.innerHTML = `<span class="t-prompt-str">${getPrompt()}</span><span style="color:var(--text)">${esc(val)}</span>`;
      linesDiv.appendChild(cline);

      const result = executeCmd(val);
      if (result === "__clear__") {
        linesDiv.innerHTML = "";
      } else if (Array.isArray(result)) {
        result.forEach(r => {
          const d = document.createElement("div");
          d.className = "t-out" + (r.c ? " " + r.c : "");
          d.textContent = r.t;
          linesDiv.appendChild(d);
        });
        if (result.length > 0) addXP(5, "command executed");
      }

      input.value = "";
      promptEl.textContent = getPrompt();
      if (titleEl) titleEl.textContent = `student@linuxbox:${termCwd.replace("/home/student","~")}`;
      body.scrollTop = body.scrollHeight;

    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (cmdHistory.length) {
        cmdHistIdx = Math.min(cmdHistIdx + 1, cmdHistory.length - 1);
        input.value = cmdHistory[cmdHistIdx];
      }
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (cmdHistIdx > 0) { cmdHistIdx--; input.value = cmdHistory[cmdHistIdx]; }
      else { cmdHistIdx = -1; input.value = ""; }
    } else if (e.key === "Tab") {
      e.preventDefault();
      const parts  = input.value.split(" ");
      const last   = parts[parts.length - 1];
      if (last) {
        const node = vfs[termCwd];
        if (node && node.children) {
          const match = node.children.find(c => c.startsWith(last));
          if (match) { parts[parts.length - 1] = match; input.value = parts.join(" "); }
        }
      }
    }
  });
}

function injectCmd(termId, cmd) {
  const input = document.getElementById(termId + "-input");
  if (!input) return;
  input.value = cmd;
  input.focus();
  input.dispatchEvent(new KeyboardEvent("keydown", { key:"Enter", bubbles:true }));
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ════════════════════════════════════════
   SIDEBAR
════════════════════════════════════════ */
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = `<div class="sidebar-section">Modules</div>`;
  MODULES.forEach((m, i) => {
    const done   = state.completed.has(i);
    const active = state.currentMod === i;
    const div = document.createElement("div");
    div.className = "mod-item" + (active?" active":"") + (done?" done":"");
    div.innerHTML = `
      <span class="mod-num">${String(i+1).padStart(2,"0")}</span>
      <span class="mod-name">${m.icon} ${m.name}</span>
      <span class="mod-check">${done?"✓":""}</span>
    `;
    div.onclick = () => gotoModule(i);
    sb.appendChild(div);
  });
}

/* ════════════════════════════════════════
   NAVIGATION
════════════════════════════════════════ */
function gotoModule(id) {
  state.currentMod = id;
  renderSidebar();
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  const panel = document.getElementById("panel-" + id);
  if (panel) {
    panel.classList.add("active");
    document.getElementById("main").scrollTop = 0;
    // Mount any pending terminals
    panel.querySelectorAll("[data-term-hints]").forEach(el => {
      const hints = JSON.parse(el.dataset.termHints || "[]");
      mountTerminal(el.id, hints);
      delete el.dataset.termHints;
    });
  }
}

function nextModule(current) {
  completeModule(current);
  if (current + 1 < MODULES.length) gotoModule(current + 1);
}

/* ════════════════════════════════════════
   QUIZ HANDLER
════════════════════════════════════════ */
function answerQuiz(btn, correct, explanation) {
  btn.closest(".quiz-opts").querySelectorAll(".quiz-opt").forEach(b => b.disabled = true);
  btn.classList.add(correct ? "correct" : "wrong");
  const fb = document.createElement("div");
  fb.className = "quiz-feedback " + (correct ? "good" : "bad");
  fb.textContent = (correct ? "✓ Correct! " : "✗ Wrong — ") + explanation;
  btn.closest(".quiz-box").appendChild(fb);
  if (correct) addXP(30, "Challenge correct!");
}

/* ════════════════════════════════════════
   PANEL BUILDER
════════════════════════════════════════ */
function buildPanel(id, html) {
  const div = document.createElement("div");
  div.className = "panel" + (id === 0 ? " active" : "");
  div.id = "panel-" + id;
  div.innerHTML = html;
  document.getElementById("main").appendChild(div);
}

function termPlaceholder(hints) {
  const id = "term" + (++termCount);
  // stored as data attr so we can lazily init on panel show
  return `<div id="${id}" data-term-hints='${JSON.stringify(hints)}'></div>`;
}

          <span class="out out-ok"># Find SUID binaries (privilege escalation targets)</span><br>
          <span class="prompt">$ </span>find / -perm -4000 -type f 2&gt;/dev/null<br><br>
          <span class="out out-ok"># Check for failed SSH login attempts</span><br>
          <span class="prompt">$ </span>grep "Failed password" /var/log/auth.log<br><br>
          <span class="out out-ok"># Who has sudo access?</span><br>
          <span class="prompt">$ </span>grep -v "^#" /etc/sudoers<br><br>
          <span class="out out-ok"># Find recently modified files</span><br>
          <span class="prompt">$ </span>find /home -mmin -60 -type f<br><br>
          <span class="out out-ok"># Check all users with shell access</span><br>
          <span class="prompt">$ </span>grep "/bin/bash" /etc/passwd
        </div>
      </div>
    </div>
